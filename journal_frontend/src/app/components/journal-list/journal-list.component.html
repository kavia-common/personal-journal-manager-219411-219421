<div class="toolbar">
  <button class="btn-primary" (click)="onCreate()">New Entry</button>
</div>

<div class="error" *ngIf="error">{{ error }}</div>

<div class="grid">
  <div class="card" *ngFor="let e of entries">
    <div class="card-header">
      <h4>{{ e.title }}</h4>
      <div class="actions">
        <button class="btn-ghost" (click)="onEdit(e)">Edit</button>
        <button class="btn-secondary" (click)="onDelete(e)">Delete</button>
      </div>
    </div>
    <div class="card-body">
      <div class="thumb" *ngIf="e.image_url">
        <img [src]="e.image_url | safeUrl" alt="Image" />
      </div>
      <p>{{ e.content }}</p>
      <div class="meta">
        <span>Updated: {{ e.updated_at | date:'medium' }}</span>
      </div>
    </div>
  </div>
</div>

<div class="drawer" *ngIf="showEditor">
  <app-journal-editor
    [entryId]="editId"
    (saved)="onSaved()"
    (cancelled)="onCancelled()"
  ></app-journal-editor>
</div>
