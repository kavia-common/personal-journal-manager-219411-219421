<section class="card">
  <div class="card-header">
    <h2>{{ isEdit ? 'Edit Entry' : 'New Entry' }}</h2>
    <a class="link" [routerLink]="['/entries']">Back to list</a>
  </div>

  <div *ngIf="loading" class="state">Loading...</div>
  <div *ngIf="error" class="state error">{{ error }}</div>

  <form *ngIf="!loading" (ngSubmit)="save()" class="form">
    <label class="label">Title</label>
    <input
      class="input"
      type="text"
      name="title"
      [(ngModel)]="entry.title"
      placeholder="A short, descriptive title"
      required
    />

    <label class="label mt">Content</label>
    <textarea
      class="textarea"
      name="content"
      [(ngModel)]="entry.content"
      rows="10"
      placeholder="Write your thoughts here..."
      required
    ></textarea>

    <div class="actions">
      <button class="btn-secondary" type="button" (click)="cancel()">Cancel</button>
      <button class="btn-primary" type="submit" [disabled]="saving">{{ saving ? 'Saving...' : 'Save' }}</button>
    </div>
  </form>
</section>
