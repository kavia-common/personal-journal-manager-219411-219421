<div class="editor-card">
  <div class="header">
    <h3>{{ entryId ? 'Edit Entry' : 'New Entry' }}</h3>
  </div>

  <form [formGroup]="form" (ngSubmit)="onSave()" class="form">
    <div class="field">
      <label>Title</label>
      <input type="text" formControlName="title" placeholder="Today’s thoughts..." />
      <div class="error" *ngIf="form.controls['title'].touched && form.controls['title'].invalid">
        Title is required and must be under 200 characters.
      </div>
    </div>

    <div class="field">
      <label>Content</label>
      <textarea formControlName="content" rows="6" placeholder="Write your entry..."></textarea>
    </div>

    <div class="field">
      <label>Image</label>
      <div class="image-row">
        <input type="file" accept="image/*" (change)="onFileSelected($event)" />
        <button type="button" class="btn-secondary" (click)="onRemoveImage()" *ngIf="imagePreviewUrl">Remove image</button>
      </div>
      <div class="thumb" *ngIf="imagePreviewUrl">
        <img [src]="imagePreviewUrl | safeUrl" alt="Preview" />
      </div>
    </div>

    <div class="actions">
      <button type="submit" class="btn-primary" [disabled]="loading">{{ entryId ? 'Save Changes' : 'Create Entry' }}</button>
      <button type="button" class="btn-ghost" (click)="onCancel()">Cancel</button>
    </div>

    <div class="error" *ngIf="error">{{ error }}</div>
  </form>
</div>
